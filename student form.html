<form action="mailto:rangelamoradi19@gmail.com" method="post" enctype="text/plain" 
      style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9; font-family: Arial, sans-serif;">

    <h2 style="text-align: center; font-weight: bold; margin-bottom: 20px;">فرم ثبت نام دانش‌آموز</h2>

    <label for="fname" style="font-weight: bold; display: block; margin-bottom: 5px;">نام:</label>
    <input type="text" id="fname" name="fname" value="رنگیلا" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label for="lname" style="font-weight: bold; display: block; margin-bottom: 5px;">نام خانوادگی:</label>
    <input type="text" id="lname" name="lname" value="مرادی" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label for="email" style="font-weight: bold; display: block; margin-bottom: 5px;">ایمیل:</label>
    <input type="email" id="email" name="email" value="rangelamoradi19@gmail.com" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label for="phone" style="font-weight: bold; display: block; margin-bottom: 5px;">شماره تماس:</label>
    <input type="tel" id="phone" name="phone" value="0708785665" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

    <label for="grade" style="font-weight: bold; display: block; margin-bottom: 5px;">پایه تحصیلی:</label>
    <select id="grade" name="grade" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">انتخاب کنید</option>
        <option value="semester1" selected>سمستر اول کمپیوتر ساینس</option>
        <option value="semester2">سمستر دوم کمپیوتر ساینس</option>
        <option value="semester3">سمستر سوم کمپیوتر ساینس</option>
    </select>

    <label style="font-weight: bold; display: block; margin-bottom: 5px;">جنسیت:</label>
    <input type="radio" id="male" name="gender" value="زن">
    <label for="male">زن</label>
    <input type="radio" id="female" name="gender" value="مرد" checked>
    <label for="female">مرد</label>

    <label for="notes" style="font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px;">توضیحات:</label>
    <textarea id="notes" name="notes" rows="4" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">علاقمند به علوم کمپیوتر</textarea>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px;">ثبت نام</button>
</form>
